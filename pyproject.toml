[project]
name = "akai-replacement-filters"
version = "0.1.0"
description = "Convert 3rd party Serum filter presets to Akai MPC filter modes, with DSP saturation, impulse response baking, and MPC program generation."
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "soundfile>=0.12",
    "zstandard>=0.21",
    "cbor2>=5.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
